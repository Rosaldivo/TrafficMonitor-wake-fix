name: Build x64 Lite

on:
  push:
  workflow_dispatch:

jobs:
  x64_build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run msbuild
      run: msbuild TrafficMonitor\TrafficMonitor.vcxproj "-p:Configuration=Release (lite)" -p:Platform=x64 -p:PlatformToolset=v143

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor_x64_lite
        path: |
          TrafficMonitor/Bin/x64/Release (lite)/TrafficMonitor.exe
          TrafficMonitor/Bin/x64/Release (lite)/*.dll
